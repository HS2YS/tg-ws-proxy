name: Docker & Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install . ruff
      - name: Run tests
        env:
          PYSTRAY_BACKEND: dummy
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: ruff check .

  docker:
    name: Docker (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: tg-ws-proxy:local
          load: true
          cache-from: type=gha,scope=tg-ws-proxy-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tg-ws-proxy-${{ matrix.arch }}
      - name: Check Compose deployment
        if: matrix.arch == 'amd64'
        run: python3 .github/scripts/docker_smoke.py
